<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a3093"/><stop offset="1" stop-color="#ff7e5f"/>
    </linearGradient>
    <style>
      .t{font:800 21px 'Segoe UI',Ubuntu,sans-serif;fill:#fff}
      .d{font:400 13.5px 'Segoe UI',Ubuntu,sans-serif;fill:#cfc4e6}
      .chip{font:700 11px 'Segoe UI',Ubuntu,sans-serif;fill:#140f1f}
      .k{font:700 11px 'Consolas',monospace;fill:#feb47b;letter-spacing:2px}
      .q{font:900 44px 'Segoe UI',Ubuntu,sans-serif;fill:#feb47b}
      .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes bob{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
      .sh{animation:sh 4s linear infinite 1.5s}
      @keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(640px)}}
    </style>
    <clipPath id="c"><rect x="1" y="1" width="438" height="198" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="438" height="198" rx="16" fill="#140f1f"/>
    <g transform="skewX(-20)"><rect class="sh" x="0" y="0" width="60" height="200" fill="#fff" opacity=".05"/></g>
    <rect x="1" y="1" width="6" height="198" fill="url(#g)"/>
  </g>
  <rect x="1" y="1" width="438" height="198" rx="16" fill="none" stroke="#3b2a55" stroke-width="2"/>
  <text class="k" x="28" y="36">PROJECT · QUIZ</text>
  <text class="t" x="28" y="66">Quisbing</text>
  <text class="d" x="28" y="94">Kumpulan kuis berbasis data JSON —</text>
  <text class="d" x="28" y="114">eksperimen awal bikin latihan soal</text>
  <text class="d" x="28" y="134">yang seru dan mudah dipakai ulang.</text>
  <g transform="translate(28 154)">
    <rect width="56" height="24" rx="12" fill="#feb47b"/><text class="chip" x="28" y="16" text-anchor="middle">JSON</text>
    <rect x="64" width="52" height="24" rx="12" fill="#c9a0ff"/><text class="chip" x="90" y="16" text-anchor="middle">Quiz</text>
  </g>
  <g transform="translate(350 70)">
    <circle cx="30" cy="30" r="34" fill="url(#g)" opacity=".2"/>
    <text class="q bob" x="30" y="46" text-anchor="middle">?</text>
  </g>
</svg>
