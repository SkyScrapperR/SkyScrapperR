<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 200" width="440" height="200">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff7e5f"/><stop offset="1" stop-color="#6a3093"/>
    </linearGradient>
    <style>
      .t{font:800 21px 'Segoe UI',Ubuntu,sans-serif;fill:#fff}
      .d{font:400 13.5px 'Segoe UI',Ubuntu,sans-serif;fill:#cfc4e6}
      .chip{font:700 11px 'Segoe UI',Ubuntu,sans-serif;fill:#140f1f}
      .k{font:700 11px 'Consolas',monospace;fill:#feb47b;letter-spacing:2px}
      .bob{animation:bob 3s ease-in-out infinite}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
      .sh{animation:sh 4s linear infinite}
      @keyframes sh{from{transform:translateX(-200px)}to{transform:translateX(640px)}}
    </style>
    <clipPath id="c"><rect x="1" y="1" width="438" height="198" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="1" y="1" width="438" height="198" rx="16" fill="#140f1f"/>
    <g transform="skewX(-20)"><rect class="sh" x="0" y="0" width="60" height="200" fill="#fff" opacity=".05"/></g>
    <rect x="1" y="1" width="6" height="198" fill="url(#g)"/>
  </g>
  <rect x="1" y="1" width="438" height="198" rx="16" fill="none" stroke="#3b2a55" stroke-width="2"/>
  <text class="k" x="28" y="36">FEATURED · EDTECH</text>
  <text class="t" x="28" y="66">Jelajah Pencernaan</text>
  <text class="d" x="28" y="94">Media pembelajaran 3D interaktif tentang</text>
  <text class="d" x="28" y="114">sistem pencernaan untuk IPAS kelas V SD,</text>
  <text class="d" x="28" y="134">lengkap dengan narasi suara &amp; asesmen game.</text>
  <g transform="translate(28 154)">
    <rect width="78" height="24" rx="12" fill="#feb47b"/><text class="chip" x="39" y="16" text-anchor="middle">JavaScript</text>
    <rect x="86" width="44" height="24" rx="12" fill="#ff7e5f"/><text class="chip" x="108" y="16" text-anchor="middle">3D</text>
    <rect x="138" width="96" height="24" rx="12" fill="#c9a0ff"/><text class="chip" x="186" y="16" text-anchor="middle">Gamification</text>
  </g>
  <g transform="translate(350 70)"><g class="bob">
    <circle cx="30" cy="30" r="34" fill="url(#g)" opacity=".18"/>
    <path d="M18 10 h24 v10 c0 6 -6 6 -6 12 c0 8 14 6 14 18 c0 10 -10 14 -20 14 c-12 0 -18 -8 -18 -16 c0 -8 8 -10 8 -16 c0 -6 -2 -8 -2 -12 z" fill="none" stroke="#feb47b" stroke-width="3" stroke-linejoin="round"/>
  </g></g>
</svg>
