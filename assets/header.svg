<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140a2a"/>
      <stop offset="0.38" stop-color="#4b1d6e"/>
      <stop offset="0.66" stop-color="#c94b6d"/>
      <stop offset="0.85" stop-color="#ff7e5f"/>
      <stop offset="1" stop-color="#feb47b"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4"/>
      <stop offset="0.55" stop-color="#ffcf7a"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a1650"/>
      <stop offset="1" stop-color="#140a2a"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="380" rx="18"/></clipPath>
    <style>
      .tw{animation:tw 3s ease-in-out infinite}
      .tw2{animation:tw 4.2s ease-in-out infinite .8s}
      .tw3{animation:tw 2.6s ease-in-out infinite 1.6s}
      @keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
      .glow{animation:pulse 5s ease-in-out infinite;transform-origin:600px 270px}
      @keyframes pulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.12);opacity:1}}
      .w1{animation:drift 9s linear infinite}
      .w2{animation:drift 14s linear infinite reverse}
      .w3{animation:drift 20s linear infinite}
      @keyframes drift{from{transform:translateX(0)}to{transform:translateX(-600px)}}
      .bird{animation:fly 16s linear infinite}
      @keyframes fly{from{transform:translate(-80px,0)}to{transform:translate(1300px,-40px)}}
      .flap{animation:flap .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      @keyframes flap{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
      .title{font:800 54px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:3px;fill:#fff;opacity:0;animation:rise 1.2s ease-out .2s forwards}
      .sub{font:600 20px 'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;letter-spacing:6px;fill:#ffe3c9;opacity:0;animation:rise 1.2s ease-out .8s forwards}
      .tag{font:600 13px 'Consolas','Courier New',monospace;letter-spacing:2px;fill:#feb47b;opacity:0;animation:rise 1s ease-out 1.4s forwards}
      @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="url(#sky)"/>

    <!-- stars -->
    <g fill="#fff">
      <circle class="tw" cx="80" cy="40" r="1.6"/><circle class="tw2" cx="190" cy="85" r="1.2"/>
      <circle class="tw3" cx="320" cy="30" r="1.8"/><circle class="tw" cx="455" cy="70" r="1.1"/>
      <circle class="tw2" cx="770" cy="38" r="1.5"/><circle class="tw3" cx="880" cy="92" r="1.2"/>
      <circle class="tw" cx="1010" cy="48" r="1.9"/><circle class="tw2" cx="1130" cy="100" r="1.3"/>
      <circle class="tw3" cx="1160" cy="28" r="1.1"/><circle class="tw" cx="40" cy="120" r="1.2"/>
      <circle class="tw2" cx="660" cy="22" r="1.3"/><circle class="tw3" cx="545" cy="110" r="1"/>
    </g>

    <!-- sun -->
    <circle class="glow" cx="600" cy="270" r="140" fill="url(#glow)"/>
    <circle cx="600" cy="270" r="62" fill="url(#sun)"/>

    <!-- birds -->
    <g class="bird" fill="none" stroke="#2a0f3d" stroke-width="2.4" stroke-linecap="round">
      <path class="flap" d="M0 120 q8 -8 16 0 q8 -8 16 0"/>
      <path class="flap" d="M40 135 q6 -6 12 0 q6 -6 12 0"/>
    </g>

    <!-- candi bentar (split gate) silhouettes -->
    <g fill="#1d0b2c">
      <path d="M560 300 L468 300 L468 280 L480 280 L480 262 L494 262 L494 242 L504 242 L504 224 L514 224 L514 208 L524 208 L524 194 L534 194 L534 182 L544 182 L544 172 L552 172 L552 164 L560 164 Z"/>
      <path d="M640 300 L732 300 L732 280 L720 280 L720 262 L706 262 L706 242 L696 242 L696 224 L686 224 L686 208 L676 208 L676 194 L666 194 L666 182 L656 182 L656 172 L648 172 L648 164 L640 164 Z"/>
      <g fill="#ff9a6b" opacity=".35"><rect x="480" y="241" width="80" height="2"/><rect x="640" y="241" width="80" height="2"/><rect x="510" y="207" width="50" height="2"/><rect x="640" y="207" width="50" height="2"/></g>
      <!-- palm trees -->
      <path d="M150 300 C152 260 158 230 170 205 L174 207 C163 232 158 262 157 300 Z"/>
      <path d="M171 206 c-22 -10 -44 -6 -58 6 c18 -4 36 -4 56 2 z M172 205 c10 -20 30 -28 52 -26 c-18 6 -32 14 -48 28 z M172 206 c20 -6 42 0 54 14 c-18 -6 -34 -8 -52 -10 z M171 205 c-10 -18 -28 -26 -46 -24 c16 6 30 14 44 26 z"/>
      <path d="M1040 300 C1038 268 1030 240 1018 220 L1014 222 C1025 244 1032 270 1033 300 Z"/>
      <path d="M1017 221 c22 -10 44 -6 58 6 c-18 -4 -36 -4 -56 2 z M1016 220 c-10 -20 -30 -28 -52 -26 c18 6 32 14 48 28 z M1016 221 c-20 -6 -42 0 -54 14 c18 -6 34 -8 52 -10 z M1017 220 c10 -18 28 -26 46 -24 c-16 6 -30 14 -44 26 z"/>
    </g>

    <!-- sea -->
    <rect y="300" width="1200" height="80" fill="url(#sea)"/>
    <!-- sun reflection -->
    <g fill="#ffcf7a" opacity=".55">
      <rect x="548" y="306" width="104" height="3" rx="1.5"/><rect x="565" y="316" width="70" height="3" rx="1.5"/>
      <rect x="578" y="326" width="44" height="2.5" rx="1.2"/><rect x="590" y="335" width="20" height="2" rx="1"/>
    </g>
    <g class="w3" fill="#5b2470" opacity=".55">
      <path d="M0 312 q50 -10 100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 t100 0 V380 H0 Z"/>
    </g>
    <g class="w2" fill="#3e1758" opacity=".75">
      <path d="M0 335 q37.5 -9 75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 t75 0 V380 H0 Z"/>
    </g>
    <g class="w1" fill="#1d0b2c">
      <path d="M0 355 q25 -7 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 V380 H0 Z"/>
    </g>

    <!-- text -->
    <text class="tag" x="600" y="60" text-anchor="middle">&lt; OM SWASTYASTU /&gt;</text>
    <text class="title" x="600" y="118" text-anchor="middle">I WAYAN BAGUS SOMABAWA</text>
    <text class="sub" x="600" y="156" text-anchor="middle">FUTURE TEACHER  ·  CRYPTO TRADER  ·  TECH EXPLORER</text>
  </g>
</svg>
